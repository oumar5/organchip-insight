[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "organchip-insight-api"
version = "0.2.0"
description = "API and image-analysis foundation for OrganChip Insight"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "numpy>=2.0,<3.0",
  "pillow>=11.0,<12.0",
  "pydantic-settings>=2.7,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "scikit-image>=0.25,<0.27",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.9,<1.0",
]
ml = [
  "openpyxl>=3.1,<4.0",
  "pandas>=2.2,<3.0",
  "scikit-learn>=1.6,<2.0",
]
inference = [
  "onnxruntime>=1.22,<1.24",
]

[project.scripts]
organchip-infer = "inference:main"

[tool.setuptools]
py-modules = ["inference"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "evaluation*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
