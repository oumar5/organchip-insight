chapters:
  - id: promise-a
    title: Une expérience auditable
    narration: La microscopie d'organes sur puce exige plus qu'un score de modèle.
    steps: [{action: pause, durationMs: 100, caption: Une expérience auditable, holdMs: 0}]
  - id: promise-b
    title: Les preuves restent réunies
    narration: OrganChip Insight réunit images, mesures, provenance et limites scientifiques.
    steps: [{action: pause, durationMs: 100, caption: Les preuves restent réunies, holdMs: 0}]
  - id: protocol-a
    title: Un protocole avant l'analyse
    narration: Consignez l'objectif avant l'analyse, puis importez les images publiques vérifiées.
    steps: [{action: pause, durationMs: 100, caption: Un protocole avant l'analyse, holdMs: 0}]
  - id: protocol-b
    title: Les sources sont préservées
    narration: L'import reste séparé de l'inférence ; les sources ne sont jamais dupliquées.
    steps: [{action: pause, durationMs: 100, caption: Les sources sont préservées, holdMs: 0}]
  - id: analysis-a
    title: Une analyse locale
    narration: Le moteur adaptatif fonctionne localement sur processeur, sans poids appris.
    steps: [{action: pause, durationMs: 100, caption: Une analyse locale, holdMs: 0}]
  - id: analysis-b
    title: Fidèle à la source
    narration: Il analyse le TIFF original ; l'aperçu normalisé sert uniquement à l'affichage.
    steps: [{action: pause, durationMs: 100, caption: Fidèle à la source, holdMs: 0}]
  - id: limits-a
    title: Une inspection synchronisée
    narration: Zoomez ensemble sur la source et la segmentation pour inspecter l'overlay.
    steps: [{action: pause, durationMs: 100, caption: Une inspection synchronisée, holdMs: 0}]
  - id: limits-b
    title: Des limites explicites
    narration: Les composantes ne sont pas des cellules ; les unités physiques exigent une calibration.
    steps: [{action: pause, durationMs: 100, caption: Des limites explicites, holdMs: 0}]
  - id: export-a
    title: Des exports reproductibles
    narration: Les exports JSON et CSV conservent l'expérience et les résultats par image.
    steps: [{action: pause, durationMs: 100, caption: Des exports reproductibles, holdMs: 0}]
  - id: export-b
    title: Une comparaison descriptive
    narration: Une seconde expérience se compare descriptivement, sans conclusion biologique.
    steps: [{action: pause, durationMs: 100, caption: Une comparaison descriptive, holdMs: 0}]
  - id: benchmarks-a
    title: Précision et coût
    narration: Les benchmarks versionnés publient précision, incertitude, temps et mémoire.
    steps: [{action: pause, durationMs: 100, caption: Précision et coût, holdMs: 0}]
  - id: benchmarks-b
    title: Des décisions fondées sur les preuves
    narration: Les règles de promotion restent visibles, y compris les résultats négatifs.
    steps: [{action: pause, durationMs: 100, caption: Des décisions fondées sur les preuves, holdMs: 0}]
  - id: credibility-a
    title: Les raccourcis d'acquisition
    narration: La classification de qualité n'échappe pas aux raccourcis d'acquisition.
    steps: [{action: pause, durationMs: 100, caption: Les raccourcis d'acquisition, holdMs: 0}]
  - id: credibility-b
    title: Une abstention honnête
    narration: Le jeu de test gelé reste fermé ; le produit s'abstient et montre ses limites.
    steps: [{action: pause, durationMs: 100, caption: Une abstention honnête, holdMs: 0}]
