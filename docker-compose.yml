services:
  backend:
    build:
      context: ./backend
    environment:
      ORGANCHIP_APP_NAME: ${ORGANCHIP_APP_NAME:-OrganChip Insight API}
      ORGANCHIP_ENVIRONMENT: ${ORGANCHIP_ENVIRONMENT:-development}
      ORGANCHIP_DATA_DIR: /data
      ORGANCHIP_CORS_ORIGINS: ${ORGANCHIP_CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
    ports:
      - "8000:8000"
    volumes:
      - organchip_data:/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  organchip_data:

